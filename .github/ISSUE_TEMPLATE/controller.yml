name: A controller without a profile
description: padbridge sees your controller but does not know its buttons
labels: [profile]
body:
  - type: input
    id: model
    attributes:
      label: Controller
      description: Brand, model, and whether it is connected over Bluetooth or USB
    validations:
      required: true
  - type: textarea
    id: probe
    attributes:
      label: Output of padbridge probe
      render: text
    validations:
      required: true
  - type: textarea
    id: learned
    attributes:
      label: Profile from padbridge learn, if you made one
      render: text
  - type: markdown
    attributes:
      value: A short `padbridge record` capture (pcapng) while pressing each button once helps a lot. Attach it if you can.
